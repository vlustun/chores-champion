server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;
    server_tokens off;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # dotfiles (.env, .git, ...)
    location ~ /\. { deny all; return 404; }

    # Compiled, digest-named asset-mapper files: cache forever.
    # (add_header in a location resets inherited ones, so repeat the security header)
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Metrics are for internal scrapers only; not exposed through the public proxy.
    location = /metrics { deny all; return 404; }

    # php-fpm health endpoints: internal only
    location ~ ^/(ping|status)$ { deny all; return 404; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller is executable
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 30s;
        internal;
    }

    # any other .php file is not served
    location ~ \.php$ { return 404; }
}
