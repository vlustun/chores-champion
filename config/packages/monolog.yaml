monolog:
    # Channels: app (default autowired LoggerInterface), audit (admin change trail),
    # security (logins), performance (slow requests/queries + request metrics).
    channels:
        - app
        - audit
        - security
        - performance
        - deprecation

# JSON lines, one file per concern, rotated daily. Processors (request_id/user_id,
# PII scrubbing) are registered via #[AsMonologProcessor] in src/Logging.
when@dev:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: '%kernel.logs_dir%/app.log'
                max_files: 7
                level: debug
                formatter: monolog.formatter.json
                channels: ['!event', '!audit', '!security', '!performance']
            audit:
                type: rotating_file
                path: '%kernel.logs_dir%/audit.log'
                max_files: 30
                level: info
                formatter: monolog.formatter.json
                channels: [audit]
            security:
                type: rotating_file
                path: '%kernel.logs_dir%/security.log'
                max_files: 30
                level: info
                formatter: monolog.formatter.json
                channels: [security]
            performance:
                type: rotating_file
                path: '%kernel.logs_dir%/performance.log'
                max_files: 7
                level: info
                formatter: monolog.formatter.json
                channels: [performance]
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/test.log'
                level: warning
                formatter: monolog.formatter.json
                channels: ['!event']

when@prod:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: '%kernel.logs_dir%/app.log'
                max_files: 14
                level: '%env(APP_LOG_LEVEL)%'
                formatter: monolog.formatter.json
                channels: ['!event', '!audit', '!security', '!performance', '!deprecation']
            audit:
                type: rotating_file
                path: '%kernel.logs_dir%/audit.log'
                max_files: 365   # audit trail is also in the DB; files are the tamper-evident copy
                level: info
                formatter: monolog.formatter.json
                channels: [audit]
            security:
                type: rotating_file
                path: '%kernel.logs_dir%/security.log'
                max_files: 90
                level: info
                formatter: monolog.formatter.json
                channels: [security]
            performance:
                type: rotating_file
                path: '%kernel.logs_dir%/performance.log'
                max_files: 14
                level: info
                formatter: monolog.formatter.json
                channels: [performance]
            stderr:
                type: stream
                path: php://stderr
                level: error
                formatter: monolog.formatter.json
                channels: ['!event', '!audit', '!deprecation']
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
