security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|_wdt/|assets/)
            security: false

        # Reserved for the REST API (iteration 2). Stateless; no authenticator yet,
        # so everything below /api/v1 answers 401 until token/JWT auth is chosen
        # (see docs/DECISIONS.md). Candidates: `access_token:` or lexik/jwt.
        api:
            pattern: ^/api/
            stateless: true
            provider: app_user_provider
            entry_point: App\Security\AuthenticationEntryPoint
            # access_token:
            #     token_handler: App\Security\ApiTokenHandler

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\AuthenticationEntryPoint
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_tasks
            logout:
                path: app_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        # /metrics: controller allows admins OR allow-listed networks (scrapers have no session)
        - { path: ^/metrics$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
