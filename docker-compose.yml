name: chores-champion

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chores}
      MYSQL_USER: ${MYSQL_USER:-chores}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chores}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/chores.cnf:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Production-like stack: nginx (web) -> php-fpm (app) -> db.
  #   cp .env.docker.example .env.docker
  #   docker compose --env-file .env.docker up -d --build
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: fpm
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env.docker}
      DATABASE_URL: "mysql://${MYSQL_USER:-chores}:${MYSQL_PASSWORD:-chores}@db:3306/${MYSQL_DATABASE:-chores}?serverVersion=8.4&charset=utf8mb4"
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-no-reply@example.com}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      additional_contexts:
        app: service:app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy

  # Dev mail catcher: SMTP on 1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Optional DB UI:  docker compose --profile tools up -d adminer
  adminer:
    image: adminer:4
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"

  # Optional PHP toolbox for machines without the needed PHP extensions
  # (intl, pdo_mysql, ...). Usage: make test RUN="docker compose run --rm php"
  php:
    build: ./docker/php
    profiles: ["tools"]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_URL: "mysql://chores:chores@db:3306/chores?serverVersion=8.4&charset=utf8mb4"
      COMPOSER_HOME: /tmp/composer
      HOME: /tmp
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data:
