name: chores-champion

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chores
      MYSQL_USER: chores
      MYSQL_PASSWORD: chores
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/chores.cnf:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Optional DB UI:  docker compose --profile tools up -d adminer
  adminer:
    image: adminer:4
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"

  # Optional PHP toolbox for machines without the needed PHP extensions
  # (intl, pdo_mysql, ...). Usage: make test RUN="docker compose run --rm php"
  php:
    build: ./docker/php
    profiles: ["tools"]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_URL: "mysql://chores:chores@db:3306/chores?serverVersion=8.4&charset=utf8mb4"
      COMPOSER_HOME: /tmp/composer
      HOME: /tmp
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data:
